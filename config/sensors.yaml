channels:
  - {name: mq2,          kind: mox_analog, sign: 1,  adc_gain: 1}
  - {name: mq3,          kind: mox_analog, sign: 1,  adc_gain: 1}
  - {name: mq135,        kind: mox_analog, sign: 1,  adc_gain: 1}
  - {name: mq137,        kind: mox_analog, sign: 1,  adc_gain: 1}
  - {name: mq138,        kind: mox_analog, sign: 1,  adc_gain: 1}
  - {name: tgs2620,      kind: mox_analog, sign: 1,  adc_gain: 1, optional: true}
  - {name: mics2714_no2, kind: mox_analog, sign: -1, adc_gain: 1}   # INVERTED: resistance increases with NO2
  - {name: mics2714_h2,  kind: mox_analog, sign: 1,  adc_gain: 1}

bme688:
  profile_steps: 10

ratios:
  - [mq3, mq138]
  - [mq137, mq135]
  - [mics2714_no2, mq135]
  - [tgs2620, mq3]
  - [tgs2620, mq135]
  - [mq2, mq135]

transient:
  window_s: 10.0
  baseline_s: 2.0
